services:
  - type: web
    name: razorrecover-ai
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: Dockerfile
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: AI_MODEL
        value: llama-3.3-70b-versatile
